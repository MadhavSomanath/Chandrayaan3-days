name = "chandrayaan3-days-chat"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# Pages allowed to call the chat. Add your own domain here if you move the site.
ALLOWED_ORIGINS = "https://madhavsomanath.github.io,http://localhost:8765"

# 8 questions per minute per visitor IP.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 8, period = 60 }

# 40 questions per minute for the whole site, however many IPs ask (per Cloudflare location).
[[ratelimits]]
name = "SITE_LIMITER"
namespace_id = "1002"
simple = { limit = 40, period = 60 }

# The Claude API key is NOT here. Locally it goes in .dev.vars (git-ignored);
# in production run: npx wrangler secret put ANTHROPIC_API_KEY
